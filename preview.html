<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resume Preview</title>

<link rel="stylesheet" href="resume.css">

</head>

<body>

<div class="container">

<h1>Mission Canada AI</h1>

<h2>Your Canadian ATS Resume</h2>

<div id="resumePreview"
style="
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
line-height:1.8;
white-space:pre-wrap;
font-size:16px;
">
</div>

<br>

<button onclick="window.print()">

🖨 Print / Save as PDF

</button>

<br><br>

<button onclick="window.location.href='resume.html'">

⬅ Back

</button>

</div>

<script>

<script>

const resume = localStorage.getItem("generatedResume");

const preview = document.getElementById("resumePreview");

if(resume){

preview.innerHTML = resume
.replace(/\n/g,"<br>")
.replace(/CANADIAN ATS RESUME/g,"<h1 style='color:#0d6efd;'>CANADIAN ATS RESUME</h1>")
.replace(/PROFESSIONAL SUMMARY/g,"<h2 style='color:#0d6efd;'>Professional Summary</h2>")
.replace(/WORK EXPERIENCE/g,"<h2 style='color:#0d6efd;'>Work Experience</h2>")
.replace(/EDUCATION/g,"<h2 style='color:#0d6efd;'>Education</h2>")
.replace(/SKILLS/g,"<h2 style='color:#0d6efd;'>Skills</h2>")
.replace(/CORE SKILLS/g,"<h2 style='color:#0d6efd;'>Core Skills</h2>")
.replace(/CERTIFICATIONS/g,"<h2 style='color:#0d6efd;'>Certifications</h2>")
.replace(/LANGUAGES/g,"<h2 style='color:#0d6efd;'>Languages</h2>")
.replace(/REFERENCES/g,"<h2 style='color:#0d6efd;'>References</h2>");

}else{

preview.innerHTML="<h2>No Resume Found</h2>";

}

</script>

</body>

</html>
