<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mission Canada AI - Resume Builder</title>

<link rel="stylesheet" href="resume.css">

</head>

<body>

<div class="container">

<h1>Mission Canada AI</h1>

<h2>Canadian ATS Resume Builder</h2>

<form id="resumeForm">

<input type="text" id="fullName" placeholder="Full Name" required>

<input type="email" id="email" placeholder="Email Address" required>

<input type="text" id="phone" placeholder="Phone Number" required>

<input type="text" id="address" placeholder="Address">

<textarea id="summary" placeholder="Professional Summary"></textarea>
<h3>Core Skills</h3>

<textarea id="coreSkills"
placeholder="Example:
Production
Warehouse
Forklift
Packaging
Quality Control
Inventory Management"></textarea>

<h3>Languages</h3>

<input type="text"
id="languages"
placeholder="English, Urdu">

<h3>Certifications</h3>
<h3>Job Title</h3>

<input
type="text"
id="jobTitle"
placeholder="Example: Warehouse Worker">
<input type="text"
id="certifications"
placeholder="Forklift License, WHMIS, First Aid (Optional)">
<textarea id="experience" placeholder="Work Experience"></textarea>

<textarea id="education" placeholder="Education"></textarea>

<textarea id="skills" placeholder="Skills"></textarea>

<button type="submit">

Generate Resume

</button>
<button type="button" id="optimizeBtn">

🤖 Optimize for Canada Job

</button>
</form>

</div>
<script>
alert("resume.html Loaded");
</script>
<script src="resume.js"></script>

</body>

</html>
